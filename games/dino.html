<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dino Runner | سوق الجمعة</title>
<style>
  :root {
    --sky-day: #f7f8fa;
    --sky-day-2: #e8edf3;
    --ground-day: #4a5568;
    --ink-day: #2d3748;
    --sky-night: #0d1120;
    --sky-night-2: #1a2036;
    --ground-night: #7c88b8;
    --ink-night: #e2e6f5;
    --accent: #ff5470;
    --accent-2: #00d9c0;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #1a1d29;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    position: relative;
    width: 900px;
    max-width: 96vw;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
  }

  canvas {
    display: block;
    width: 100%;
    background: var(--sky-day);
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 18px;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }

  #brand {
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--ink-day);
    opacity: 0.55;
    transition: color 0.5s ease;
  }

  #scoreBox {
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 1px;
    color: var(--ink-day);
    transition: color 0.5s ease;
    display: flex;
    gap: 14px;
  }

  #scoreBox .hi { opacity: 0.5; }

  .night-text { color: var(--ink-night) !important; }

  /* ---------- Overlay ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(0,0,0,0);
    transition: background 0.3s ease;
  }

  #overlay.dimmed { background: rgba(10,12,20,0.35); backdrop-filter: blur(2px); }

  #panel {
    background: rgba(255,255,255,0.92);
    border-radius: 18px;
    padding: 28px 36px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    max-width: 320px;
  }

  #panel.night { background: rgba(24,27,42,0.92); }

  #titleText {
    font-size: 24px;
    margin: 0 0 6px 0;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--ink-day);
  }

  #panel.night #titleText { color: var(--ink-night); }

  #subText {
    margin: 0 0 14px 0;
    font-size: 13.5px;
    color: #718096;
    line-height: 1.5;
  }

  #panel.night #subText { color: #a0aec0; }

  #statLine {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 14px 0;
  }

  #playBtn {
    background: linear-gradient(135deg, var(--accent), #ff8a5c);
    color: white;
    border: none;
    padding: 11px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(255,84,112,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #playBtn:active { transform: scale(0.95); }

  .keyhint {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    padding: 1px 6px;
    border-radius: 5px;
    background: rgba(45,55,72,0.1);
    font-size: 11px;
    font-weight: 700;
    margin: 0 2px;
  }
  #panel.night .keyhint { background: rgba(255,255,255,0.12); color: #e2e6f5; }

  .hidden { display: none !important; }

  #flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
  }

  /* ---------- Fullscreen / rotate ---------- */
  #fsBtn {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: none;
    background: rgba(45,55,72,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
  }
  #fsBtn svg { width: 17px; height: 17px; fill: var(--ink-day); }
  #fsBtn.night { background: rgba(255,255,255,0.1); }
  #fsBtn.night svg { fill: var(--ink-night); }

  #rotateHint {
    position: fixed;
    inset: 0;
    background: #14161f;
    color: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    text-align: center;
    padding: 20px;
    font-family: inherit;
  }
  #rotateHint svg {
    width: 56px; height: 56px;
    margin-bottom: 14px;
    animation: rotateIcon 1.6s ease-in-out infinite;
  }
  #rotateHint p { font-size: 15px; opacity: 0.85; margin: 0; max-width: 260px; }

  @keyframes rotateIcon {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }

  /* Mobile touch controls */
  #touchControls {
    position: absolute;
    inset: 0;
    display: none;
    z-index: 3;
  }
  #touchControls .zone {
    flex: 1;
    -webkit-tap-highlight-color: transparent;
  }

  @media (pointer: coarse) {
    #touchControls { display: flex; }
  }

  /* Fullscreen mode sizing */
  #stage:fullscreen,
  #stage:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    max-width: none;
    border-radius: 0;
  }
  #stage:fullscreen canvas,
  #stage:-webkit-full-screen canvas {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: var(--sky-day);
  }

  @media (max-width: 640px) {
    #stage { border-radius: 0; width: 100vw; max-width: 100vw; }
    #panel { padding: 22px 24px; max-width: 84vw; }
    #titleText { font-size: 20px; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game" width="900" height="260"></canvas>

  <div id="hud">
    <div id="brand">DINO RUNNER</div>
    <div id="scoreBox"><span class="hi" id="hiVal">HI 00000</span><span id="curVal">00000</span></div>
  </div>

  <button id="fsBtn" title="Fullscreen">
    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
  </button>

  <div id="touchControls">
    <div class="zone" id="zoneJump"></div>
    <div class="zone" id="zoneDuck"></div>
  </div>

  <div id="overlay">
    <div id="panel">
      <h1 id="titleText">DINO RUNNER</h1>
      <p id="subText">
        <span class="keyhint">Space</span> / <span class="keyhint">↑</span> jump &nbsp;•&nbsp;
        <span class="keyhint">↓</span> duck<br>
        On mobile: tap right half to jump, hold left to duck.
      </p>
      <p id="statLine" class="hidden"></p>
      <button id="playBtn">PLAY</button>
    </div>
  </div>

  <div id="flash"></div>
</div>

<div id="rotateHint">
  <svg viewBox="0 0 24 24" fill="#fff"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0V-.5v.5V4l4.48-1.48zM12 4V-.02V4zM10 22.5V24l4-4-4-4v3.5c-3.5-.5-6.24-3.44-6.6-7H1.9c.35 4.72 4.27 8.5 8.1 9V22.5zM7.52 21.48C4.25 19.93 1.91 16.76 1.55 13H.05C.56 19.16 5.71 24 12 24v-3.98c0-.02-.01-.03-.01-.05L7.52 21.48z"/><path d="M12 6a6 6 0 100 12 6 6 0 000-12z" opacity="0"/></svg>
  <p>Rotate your phone or tap fullscreen for the best view</p>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const brand = document.getElementById('brand');
  const scoreBox = document.getElementById('scoreBox');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const titleText = document.getElementById('titleText');
  const subText = document.getElementById('subText');
  const statLine = document.getElementById('statLine');
  const playBtn = document.getElementById('playBtn');
  const flashEl = document.getElementById('flash');
  const fsBtn = document.getElementById('fsBtn');
  const rotateHint = document.getElementById('rotateHint');
  const hiVal = document.getElementById('hiVal');
  const curVal = document.getElementById('curVal');
  const zoneJump = document.getElementById('zoneJump');
  const zoneDuck = document.getElementById('zoneDuck');

  const BASE_W = 900, BASE_H = 260;
  let W = BASE_W, H = BASE_H;
  let GROUND_Y = H - 40;

  // ---------- Utility ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const chance = (p) => Math.random() < p;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Game state ----------
  let state = 'ready'; // ready | running | dead
  const BASE_SPEED = 6.2;
  const MAX_SPEED = 13.5;
  let speed = BASE_SPEED;
  let score = 0;
  let hiScore = Number(localStorage.getItem('dinoHi') || 0);
  let frame = 0;
  let night = false;
  let flashTimer = 0;
  let shakeTimer = 0;

  hiVal.textContent = 'HI ' + String(hiScore).padStart(5, '0');

  // ---------- Dino (physics constants tuned so max jump distance is known) ----------
  const dino = {
    x: 60,
    y: 0,
    w: 42,
    h: 46,
    duckW: 60,
    duckH: 28,
    vy: 0,
    gravity: 0.66,
    jumpForce: -12.6,
    grounded: true,
    ducking: false,
    legFrame: 0,
    legTimer: 0,
    blinkTimer: rand(60, 200),
    blinking: false,
    squash: 1
  };

  function resetDinoPos() {
    dino.y = GROUND_Y - dino.h;
  }
  resetDinoPos();

  // Max horizontal distance the dino covers during a full jump arc at a given speed.
  // Time in air (frames) = 2 * |jumpForce| / gravity. Distance = speed * airTime.
  function jumpAirFrames() {
    return (2 * Math.abs(dino.jumpForce)) / dino.gravity;
  }

  function jump() {
    if (dino.grounded && state === 'running') {
      dino.vy = dino.jumpForce;
      dino.grounded = false;
      dino.squash = 1.25;
    }
  }

  function startDuck(v) {
    if (state !== 'running') return;
    dino.ducking = v && dino.grounded;
  }

  // ---------- Clouds ----------
  let clouds = [];
  function spawnCloud() {
    clouds.push({ x: W + rand(0, 200), y: rand(20, H * 0.4), scale: rand(0.7, 1.3) });
  }
  function initClouds() {
    clouds = [];
    for (let i = 0; i < 4; i++) { spawnCloud(); clouds[i].x = rand(0, W); }
  }
  initClouds();

  // ---------- Ground bumps ----------
  let bumps = [];
  function spawnBump() { bumps.push({ x: W + rand(0, 300), w: rand(20, 60) }); }
  function initBumps() {
    bumps = [];
    for (let i = 0; i < 6; i++) { spawnBump(); bumps[i].x = rand(0, W); }
  }
  initBumps();

  // ---------- Obstacles ----------
  // FIXED GENERATION LOGIC:
  // - Every obstacle placement guarantees a minimum pixel gap derived from the
  //   dino's actual jump arc at the CURRENT speed, plus a safety margin.
  // - Clusters/multi-cactus groups only ever add width along a single ground
  //   obstacle; the gap to the NEXT obstacle is measured from the end of the
  //   whole cluster, never from an individual cactus inside it.
  // - Birds only spawn at heights that are guaranteed dodgeable either by
  //   ducking (low) or running under/over (high) — never at a height that
  //   overlaps both a standing and ducking hitbox ambiguously.
  // - Only one obstacle "unit" is scheduled at a time; the next spawn is not
  //   even considered until the previous unit clears a minimum on-screen gap.
  let obstacles = [];
  let distanceToNextSpawn = 400;

  const CACTUS_TYPES = [
    { w: 18, h: 34, arms: false },
    { w: 26, h: 48, arms: true },
    { w: 34, h: 58, arms: true }
  ];

  function minSafeGap() {
    // pixel distance the dino travels across a full jump, plus reaction buffer
    const airDist = speed * jumpAirFrames();
    return airDist * 0.9 + 60; // 90% of max jump arc + fixed buffer = always clearable
  }

  function resetObstacles() {
    obstacles = [];
    distanceToNextSpawn = 420;
  }

  function buildObstacleUnit() {
    // returns { width: totalWidth, parts: [...] } where parts have relative x offsets
    const isBird = score > 250 && chance(0.24);

    if (isBird) {
      // Bird heights relative to ground: pick a lane that is clearly one thing to do
      const lane = Math.floor(rand(0, 3));
      let y;
      if (lane === 0) y = GROUND_Y - 26;               // low: must duck or jump early
      else if (lane === 1) y = GROUND_Y - dino.h - 6;   // mid: must jump
      else y = GROUND_Y - dino.h - 46;                  // high: safe to run under (no jump needed)
      return {
        width: 46,
        parts: [{ type: 'bird', dx: 0, y, w: 46, h: 32 }]
      };
    }

    // Ground cluster: 1-3 cacti close together, but bounded total width
    const count = chance(0.55) ? 1 : Math.floor(rand(2, 4));
    let parts = [];
    let cx = 0;
    for (let i = 0; i < count; i++) {
      const t = CACTUS_TYPES[Math.floor(rand(0, CACTUS_TYPES.length))];
      parts.push({ type: 'cactus', dx: cx, y: GROUND_Y - t.h, w: t.w, h: t.h, arms: t.arms });
      cx += t.w + rand(6, 14);
    }
    return { width: cx - rand(6, 14) + parts[parts.length - 1].w, parts };
  }

  function trySpawn() {
    if (distanceToNextSpawn > 0) return;
    const unit = buildObstacleUnit();
    const baseX = W + 20;
    unit.parts.forEach(p => {
      obstacles.push({
        type: p.type,
        x: baseX + p.dx,
        y: p.y,
        w: p.w,
        h: p.h,
        arms: p.arms || false,
        wingFrame: 0,
        wingTimer: Math.floor(rand(0, 10))
      });
    });
    // schedule next spawn: guaranteed-clearable gap + random variety on top
    const variety = rand(40, 160) - clamp(speed - BASE_SPEED, 0, 20) * 2;
    distanceToNextSpawn = unit.width + minSafeGap() + Math.max(variety, 20);
  }

  // ---------- Particles ----------
  let particles = [];
  function burst(x, y) {
    for (let i = 0; i < 16; i++) {
      particles.push({ x, y, vx: rand(-4.5, 4.5), vy: rand(-6.5, -1), life: 32, c: chance(0.5) });
    }
  }

  // ---------- Input ----------
  function primaryAction() {
    if (state === 'ready') startGame();
    else if (state === 'dead') resetGame();
    else jump();
  }

  function handleDown(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      primaryAction();
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      startDuck(true);
    }
  }
  function handleUp(e) {
    if (e.code === 'ArrowDown') startDuck(false);
  }

  window.addEventListener('keydown', handleDown);
  window.addEventListener('keyup', handleUp);
  playBtn.addEventListener('click', (e) => { e.stopPropagation(); primaryAction(); });

  zoneJump.addEventListener('pointerdown', (e) => { e.preventDefault(); primaryAction(); });
  zoneDuck.addEventListener('pointerdown', (e) => { e.preventDefault(); if (state === 'ready' || state === 'dead') primaryAction(); else startDuck(true); });
  zoneDuck.addEventListener('pointerup', (e) => { startDuck(false); });
  zoneDuck.addEventListener('pointercancel', () => startDuck(false));

  canvas.addEventListener('pointerdown', () => { if (state !== 'running') primaryAction(); });

  // ---------- Fullscreen ----------
  function isFullscreen() {
    return document.fullscreenElement || document.webkitFullscreenElement;
  }

  async function toggleFullscreen() {
    try {
      if (!isFullscreen()) {
        if (stage.requestFullscreen) await stage.requestFullscreen();
        else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (err) { /* ignore unsupported */ }
  }
  fsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });

  function isMobile() {
    return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && matchMedia('(pointer:coarse)').matches);
  }

  function checkOrientation() {
    if (!isMobile()) { rotateHint.style.display = 'none'; return; }
    const portrait = window.innerHeight > window.innerWidth;
    rotateHint.style.display = (portrait && !isFullscreen()) ? 'flex' : 'none';
  }
  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', checkOrientation);
  document.addEventListener('fullscreenchange', checkOrientation);
  checkOrientation();

  // ---------- Canvas resize (keeps internal coordinate system crisp) ----------
  function resizeCanvas() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = rect.width;
    const cssH = isFullscreen() ? rect.height : rect.width * (BASE_H / BASE_W);

    canvas.style.height = isFullscreen() ? '100%' : (cssW * (BASE_H / BASE_W)) + 'px';

    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    W = cssW;
    H = cssH;
    GROUND_Y = H - Math.max(36, H * 0.14);
    resetDinoPos();
  }
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('fullscreenchange', () => setTimeout(resizeCanvas, 50));
  resizeCanvas();

  // ---------- Game flow ----------
  function startGame() {
    state = 'running';
    overlay.classList.add('hidden');
  }

  function resetGame() {
    state = 'running';
    speed = BASE_SPEED;
    score = 0;
    frame = 0;
    night = false;
    resetObstacles();
    particles = [];
    resetDinoPos();
    dino.vy = 0;
    dino.grounded = true;
    dino.ducking = false;
    overlay.classList.add('hidden');
  }

  function die() {
    state = 'dead';
    burst(dino.x + dino.w / 2, dino.y + dino.h / 2);
    shakeTimer = 10;
    if (Math.floor(score) > hiScore) {
      hiScore = Math.floor(score);
      localStorage.setItem('dinoHi', hiScore);
      hiVal.textContent = 'HI ' + String(hiScore).padStart(5, '0');
    }
    flashTimer = 8;
    titleText.textContent = 'GAME OVER';
    subText.innerHTML = '<span class="keyhint">Space</span> or tap PLAY to try again';
    statLine.textContent = 'Score ' + Math.floor(score) + '  •  Best ' + hiScore;
    statLine.classList.remove('hidden');
    playBtn.textContent = 'RETRY';
    overlay.classList.remove('hidden');
    overlay.classList.add('dimmed');
  }

  // ---------- Collision ----------
  function getDinoBox() {
    if (dino.ducking) {
      return { x: dino.x + 3, y: GROUND_Y - dino.duckH + 3, w: dino.duckW - 6, h: dino.duckH - 5 };
    }
    return { x: dino.x + 8, y: dino.y + 4, w: dino.w - 16, h: dino.h - 6 };
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ---------- Drawing helpers ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (night) {
      g.addColorStop(0, '#0d1120');
      g.addColorStop(1, '#1a2036');
    } else {
      g.addColorStop(0, '#f7f8fa');
      g.addColorStop(1, '#e8edf3');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars() {
    if (!night) return;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137.5) % W;
      const sy = (i * 61.3) % (GROUND_Y - 10);
      ctx.globalAlpha = 0.3 + 0.4 * Math.abs(Math.sin(frame * 0.03 + i * 1.7));
      ctx.beginPath();
      ctx.arc(sx, sy, 1.3, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // moon
    ctx.fillStyle = '#e9edff';
    ctx.beginPath();
    ctx.arc(W - 70, 44, 16, 0, 7);
    ctx.fill();
    ctx.fillStyle = night ? '#1a2036' : '#e8edf3';
    ctx.beginPath();
    ctx.arc(W - 62, 39, 15, 0, 7);
    ctx.fill();
  }

  function drawGround() {
    const groundColor = night ? '#3d4570' : '#cbd5e0';
    const lineColor = night ? 'var(--ground-night)'.replace('var(--ground-night)', '#7c88b8') : '#4a5568';

    ctx.fillStyle = groundColor;
    ctx.fillRect(0, GROUND_Y + 2, W, H - GROUND_Y);

    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();

    ctx.fillStyle = lineColor;
    bumps.forEach(b => { ctx.fillRect(b.x, GROUND_Y + 8, b.w, 3); });
  }

  function drawClouds() {
    ctx.fillStyle = night ? 'rgba(226,230,245,0.18)' : 'rgba(74,85,104,0.16)';
    clouds.forEach(c => {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.scale, c.scale);
      roundRect(0, 4, 34, 12, 6);
      roundRect(10, -4, 24, 14, 7);
      ctx.restore();
    });
  }

  function drawDino() {
    const c = night ? '#e2e6f5' : '#2d3748';
    const eyeC = night ? '#0d1120' : '#f7f8fa';

    ctx.save();
    ctx.translate(dino.x, 0);

    if (state === 'dead') {
      ctx.fillStyle = c;
      roundRect(2, dino.y + 8, 34, 28, 6);
      roundRect(24, dino.y, 18, 16, 4);
      ctx.fillStyle = '#ff5470';
      ctx.fillRect(30, dino.y + 5, 3, 3);
      ctx.fillRect(36, dino.y + 5, 3, 3);
      ctx.restore();
      return;
    }

    if (dino.ducking) {
      const y = GROUND_Y - dino.duckH;
      ctx.fillStyle = c;
      roundRect(0, y + 8, dino.duckW - 8, dino.duckH - 8, 7);
      roundRect(dino.duckW - 26, y, 24, 16, 6);
      const legOn = dino.legFrame === 0;
      ctx.fillRect(6, y + dino.duckH - 3, 7, 5);
      ctx.fillRect(22 + (legOn ? 5 : 0), y + dino.duckH - 3, 7, 5);
      ctx.fillStyle = eyeC;
      ctx.fillRect(dino.duckW - 10, y + 5, 3, 3);
      ctx.restore();
      return;
    }

    const y = dino.y;
    const sq = dino.squash;
    ctx.fillStyle = c;

    // tail
    roundRect(-6, y + 16, 12, 9, 3);
    // body (slight squash/stretch on jump)
    ctx.save();
    ctx.translate(6 + 11, y + 12 + 13);
    ctx.scale(1 / sq, sq);
    roundRect(-11, -13, 22, 26, 7);
    ctx.restore();
    // head
    roundRect(20, y - 2, 22, 20, 6);
    // arm
    roundRect(22, y + 24, 9, 6, 3);
    // eye
    ctx.fillStyle = eyeC;
    if (!dino.blinking) ctx.fillRect(34, y + 3, 3.5, 3.5);
    else ctx.fillRect(33, y + 5, 5, 1.5);

    // legs
    ctx.fillStyle = c;
    if (dino.grounded) {
      if (dino.legFrame === 0) {
        roundRect(9, y + 38, 7, 8, 2);
        roundRect(22, y + 38, 7, 8, 2);
      } else {
        roundRect(7, y + 38, 7, 8, 2);
        roundRect(24, y + 34, 7, 12, 2);
      }
    } else {
      roundRect(9, y + 36, 7, 9, 2);
      roundRect(22, y + 40, 7, 6, 2);
    }

    ctx.restore();
  }

  function drawObstacles() {
    const c = night ? '#e2e6f5' : '#2d3748';
    ctx.fillStyle = c;
    obstacles.forEach(o => {
      if (o.type === 'cactus') {
        roundRect(o.x, o.y, o.w, o.h, 4);
        if (o.arms) {
          roundRect(o.x - 7, o.y + o.h * 0.25, 7, o.h * 0.28, 3);
          roundRect(o.x + o.w, o.y + o.h * 0.45, 7, o.h * 0.28, 3);
        }
      } else if (o.type === 'bird') {
        const wingUp = o.wingFrame === 0;
        ctx.save();
        ctx.translate(o.x, o.y);
        roundRect(10, 10, 22, 9, 4);
        roundRect(30, 7, 10, 6, 3);
        const wy = wingUp ? 0 : 15;
        roundRect(2, wy, 16, 7, 4);
        roundRect(20, wy, 16, 7, 4);
        ctx.restore();
      }
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.fillStyle = night ? '#e2e6f5' : (p.c ? '#ff5470' : '#2d3748');
      ctx.globalAlpha = Math.max(p.life / 32, 0);
      ctx.fillRect(p.x, p.y, 4, 4);
      ctx.globalAlpha = 1;
    });
  }

  // ---------- Update ----------
  function update() {
    frame++;

    if (state === 'running') {
      score += speed * 0.085;
      speed = Math.min(MAX_SPEED, BASE_SPEED + score * 0.0028);
      night = Math.floor(score / 500) % 2 === 1;

      dino.vy += dino.gravity;
      dino.y += dino.vy;
      if (dino.y >= GROUND_Y - dino.h) {
        dino.y = GROUND_Y - dino.h;
        dino.vy = 0;
        dino.grounded = true;
      }
      dino.squash += (1 - dino.squash) * 0.2;

      dino.legTimer++;
      const legSpeed = Math.max(4, 9 - Math.floor(speed / 2));
      if (dino.legTimer > legSpeed) { dino.legTimer = 0; dino.legFrame = 1 - dino.legFrame; }

      dino.blinkTimer--;
      if (dino.blinkTimer <= 0) {
        dino.blinking = !dino.blinking;
        dino.blinkTimer = dino.blinking ? 6 : rand(80, 220);
      }
    }

    clouds.forEach(c => c.x -= speed * 0.25);
    clouds = clouds.filter(c => c.x > -50);
    if (clouds.length < 4 && chance(0.01)) spawnCloud();

    bumps.forEach(b => b.x -= speed);
    bumps = bumps.filter(b => b.x > -60);
    if (chance(0.02)) spawnBump();

    if (state === 'running') {
      distanceToNextSpawn -= speed;
      trySpawn();

      obstacles.forEach(o => {
        o.x -= speed;
        if (o.type === 'bird') {
          o.wingTimer++;
          if (o.wingTimer > 9) { o.wingTimer = 0; o.wingFrame = 1 - o.wingFrame; }
        }
      });
      obstacles = obstacles.filter(o => o.x + o.w > -30);

      const dbox = getDinoBox();
      for (const o of obstacles) {
        const pad = o.type === 'bird' ? 5 : 3;
        const obox = { x: o.x + pad, y: o.y + pad, w: o.w - pad * 2, h: o.h - pad * 2 };
        if (overlap(dbox, obox)) { die(); break; }
      }
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; });
    particles = particles.filter(p => p.life > 0);

    if (flashTimer > 0) flashTimer--;
    if (shakeTimer > 0) shakeTimer--;
  }

  // ---------- Render ----------
  function render() {
    ctx.save();
    if (shakeTimer > 0) {
      ctx.translate(rand(-3, 3) * (shakeTimer / 10), rand(-3, 3) * (shakeTimer / 10));
    }

    drawBackground();
    drawStars();
    drawClouds();
    drawGround();
    drawObstacles();
    drawDino();
    drawParticles();

    ctx.restore();

    flashEl.style.opacity = flashTimer > 0 ? (flashTimer / 8) * 0.55 : 0;

    [brand, ...scoreBox.children].forEach(el => el.classList.toggle('night-text', night));
    fsBtn.classList.toggle('night', night);
    panel.classList.toggle('night', night);
    curVal.textContent = String(Math.floor(score)).padStart(5, '0');
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
