<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Paper Scissors — vs THE MACHINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17;
    --surface: #12182b;
    --surface-2: #171f38;
    --border: #2a3252;
    --text: #e8eaf2;
    --text-dim: #8891ad;
    --player: #6a7bff;
    --ai: #ff5577;
    --win: #4ade80;
    --tie: #f4c95d;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at 50% -10%, #1a2140 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  .stage { width: 100%; max-width: 440px; }

  header { text-align: center; margin-bottom: 20px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    margin: 0;
  }

  header p { margin: 4px 0 0; color: var(--text-dim); font-size: 0.85rem; }

  .panel {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
  }

  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 6px;
  }

  .score-block { text-align: center; }
  .score-block .label { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 2px; }
  .score-block .value { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 700; line-height: 1; }
  .score-block.player .value { color: var(--player); }
  .score-block.ai .value { color: var(--ai); }
  .score-block.tie .value { color: var(--text-dim); font-size: 1.3rem; }
  .score-block.tie .label { font-size: 0.62rem; }

  .divider { width: 1px; height: 34px; background: var(--border); margin: 0 14px; }

  .arena {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 30px 0 20px;
  }

  .fighter-slot {
    width: 92px;
    height: 92px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.03);
    border: 1.5px solid var(--border);
    transition: border-color 0.25s, box-shadow 0.25s, opacity 0.25s;
  }
  .fighter-slot svg { width: 44px; height: 44px; }
  .fighter-slot.player svg { color: var(--player); }
  .fighter-slot.ai svg { color: var(--ai); }

  .fighter-slot.win-glow {
    border-color: var(--win);
    box-shadow: 0 0 0 3px rgba(74,222,128,0.15), 0 0 24px rgba(74,222,128,0.25);
  }
  .fighter-slot.lose-dim { opacity: 0.4; }

  .vs-mark {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  @keyframes clash {
    0% { transform: scale(1) rotate(0deg); }
    30% { transform: scale(1.15) rotate(-10deg); }
    55% { transform: scale(0.92) rotate(6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .clash svg { animation: clash 0.5s ease; }

  .result-line {
    text-align: center;
    min-height: 24px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 4px;
  }
  .result-line.win { color: var(--win); }
  .result-line.lose { color: var(--ai); }
  .result-line.tie { color: var(--tie); }

  .trash {
    text-align: center;
    min-height: 38px;
    color: var(--text-dim);
    font-size: 0.85rem;
    line-height: 1.4;
    margin-bottom: 20px;
    padding: 0 8px;
  }

  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  button.choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 8px 12px;
    background: rgba(255,255,255,0.03);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  button.choice svg { width: 30px; height: 30px; color: var(--text-dim); transition: color 0.15s; }
  button.choice:hover { transform: translateY(-3px); border-color: var(--player); background: rgba(106,123,255,0.08); }
  button.choice:hover svg { color: var(--player); }
  button.choice:active { transform: translateY(-1px) scale(0.97); }
  button.choice:focus-visible { outline: 2px solid var(--player); outline-offset: 2px; }

  .footer-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; }

  .streak-badge {
    font-size: 0.72rem;
    color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 100px;
  }
  .streak-badge.hot { color: var(--win); border-color: rgba(74,222,128,0.3); }
  .streak-badge.cold { color: var(--ai); border-color: rgba(255,85,119,0.3); }

  #reset {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.72rem;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 4px;
  }
  #reset:hover { color: var(--text); }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Rock, Paper, Scissors</h1>
    <p>Live match against an opponent with no self-doubt</p>
  </header>

  <div class="panel">
    <div class="scoreboard">
      <div class="score-block player">
        <div class="label">You</div>
        <div class="value" id="playerScore">0</div>
      </div>
      <div class="score-block tie">
        <div class="label">Ties</div>
        <div class="value" id="tieScore">0</div>
      </div>
      <div class="score-block ai">
        <div class="label">Machine</div>
        <div class="value" id="aiScore">0</div>
      </div>
    </div>

    <div class="arena">
      <div class="fighter-slot player" id="playerSlot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <path d="M9.2 9.2a2.8 2.8 0 1 1 3.9 2.6c-.9.5-1.4 1-1.4 1.9"></path>
          <circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <div class="vs-mark">VS</div>
      <div class="fighter-slot ai" id="aiSlot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="9" width="14" height="10" rx="2.5"></rect>
          <path d="M12 9V6"></path>
          <circle cx="12" cy="4.3" r="1.3"></circle>
          <circle cx="9" cy="14" r="1.1" fill="currentColor" stroke="none"></circle>
          <circle cx="15" cy="14" r="1.1" fill="currentColor" stroke="none"></circle>
          <path d="M9 17.3h6"></path>
          <path d="M3 12.5h2"></path>
          <path d="M19 12.5h2"></path>
        </svg>
      </div>
    </div>

    <div class="result-line" id="result">Make your move.</div>
    <div class="trash" id="trash">The machine is calibrating its judgment of your life choices.</div>

    <div class="choices">
      <button class="choice" onclick="play('rock')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 14.5 6 9.8c.3-1 1.1-1.7 2.1-1.9l3.4-.7c.6-.1 1.2 0 1.7.3l4 2.3c.8.5 1.3 1.3 1.3 2.3v1.6c0 .9-.5 1.7-1.3 2.1l-2.9 1.5c-.4.2-.8.3-1.3.3H8c-.9 0-1.7-.4-2.2-1.1l-1.1-1.5c-.4-.5-.5-1.2-.2-1.8Z"></path>
          <path d="M9 12.3l2.6-1.4"></path>
          <path d="M13.5 11.5l1.8 1.6"></path>
        </svg>
        Rock
      </button>
      <button class="choice" onclick="play('paper')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 12V6a2 2 0 0 1 4 0v5"></path>
          <path d="M11 10.7V5a2 2 0 0 1 4 0v6"></path>
          <path d="M15 10.5V7a2 2 0 0 1 4 0v7c0 4-2.5 7-7 7-3.2 0-4.9-1.4-6.4-3.6l-2-3.4c-.6-1 0-2 1-2.4 1-.4 2 0 2.6 1l1.3 2"></path>
        </svg>
        Paper
      </button>
      <button class="choice" onclick="play('scissors')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6.5" cy="6.5" r="2.3"></circle>
          <circle cx="6.5" cy="17.5" r="2.3"></circle>
          <path d="M8.3 8L19 19"></path>
          <path d="M8.3 16L19 5"></path>
        </svg>
        Scissors
      </button>
    </div>

    <div class="footer-row">
      <span class="streak-badge" id="streakBadge">No streak yet</span>
      <button id="reset" onclick="resetGame()">Reset match</button>
    </div>
  </div>
</div>

<script>
const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

const icons = {
  rock: `<path d="M4.5 14.5 6 9.8c.3-1 1.1-1.7 2.1-1.9l3.4-.7c.6-.1 1.2 0 1.7.3l4 2.3c.8.5 1.3 1.3 1.3 2.3v1.6c0 .9-.5 1.7-1.3 2.1l-2.9 1.5c-.4.2-.8.3-1.3.3H8c-.9 0-1.7-.4-2.2-1.1l-1.1-1.5c-.4-.5-.5-1.2-.2-1.8Z"></path><path d="M9 12.3l2.6-1.4"></path><path d="M13.5 11.5l1.8 1.6"></path>`,
  paper: `<path d="M7 12V6a2 2 0 0 1 4 0v5"></path><path d="M11 10.7V5a2 2 0 0 1 4 0v6"></path><path d="M15 10.5V7a2 2 0 0 1 4 0v7c0 4-2.5 7-7 7-3.2 0-4.9-1.4-6.4-3.6l-2-3.4c-.6-1 0-2 1-2.4 1-.4 2 0 2.6 1l1.3 2"></path>`,
  scissors: `<circle cx="6.5" cy="6.5" r="2.3"></circle><circle cx="6.5" cy="17.5" r="2.3"></circle><path d="M8.3 8L19 19"></path><path d="M8.3 16L19 5"></path>`,
  robot: `<rect x="5" y="9" width="14" height="10" rx="2.5"></rect><path d="M12 9V6"></path><circle cx="12" cy="4.3" r="1.3"></circle><circle cx="9" cy="14" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="15" cy="14" r="1.1" fill="currentColor" stroke="none"></circle><path d="M9 17.3h6"></path><path d="M3 12.5h2"></path><path d="M19 12.5h2"></path>`,
  question: `<circle cx="12" cy="12" r="9.5"></circle><path d="M9.2 9.2a2.8 2.8 0 1 1 3.9 2.6c-.9.5-1.4 1-1.4 1.9"></path><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"></circle>`
};

let playerScore = 0, aiScore = 0, tieScore = 0, streak = 0;

const winTrash = [
  "Beginner's luck. I'll allow it once.",
  "Recalculating my respect for you. Still low.",
  "Fine. You win this exchange of primitive hand gestures.",
  "I let you have that one. Definitely on purpose.",
  "Statistically improbable. Suspicious, even.",
];
const loseTrash = [
  "As predicted by my flawless algorithms.",
  "Was that your best? Genuinely asking.",
  "I've beaten toasters with more strategic depth than that.",
  "Skill issue detected. Deploying more commentary.",
  "Ez. E-Z. Easy.",
];
const tieTrash = [
  "A tie. How anticlimactic for both of us.",
  "Great minds think alike. Mediocre ones too, apparently.",
  "We're basically the same now. Terrifying thought.",
];
const idleLines = [
  "The machine is calibrating its judgment of your life choices.",
  "Rock. Paper. Scissors. Destiny.",
  "I have simulated this match four million times. You lose most of them.",
];

function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function aiChoice() { return randomFrom(['rock', 'paper', 'scissors']); }

function setIcon(el, key) {
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[key]}</svg>`;
}

function play(playerMove) {
  const ai = aiChoice();
  const playerSlot = document.getElementById('playerSlot');
  const aiSlot = document.getElementById('aiSlot');
  const result = document.getElementById('result');
  const trash = document.getElementById('trash');

  setIcon(playerSlot, playerMove);
  setIcon(aiSlot, ai);

  [playerSlot, aiSlot].forEach(slot => {
    slot.classList.remove('clash', 'win-glow', 'lose-dim');
    void slot.offsetWidth;
    slot.classList.add('clash');
  });

  let outcome;
  if (playerMove === ai) outcome = 'tie';
  else if (beats[playerMove] === ai) outcome = 'win';
  else outcome = 'lose';

  setTimeout(() => {
    if (outcome === 'win') {
      playerSlot.classList.add('win-glow');
      aiSlot.classList.add('lose-dim');
    } else if (outcome === 'lose') {
      aiSlot.classList.add('win-glow');
      playerSlot.classList.add('lose-dim');
    }
  }, 480);

  if (outcome === 'win') {
    playerScore++;
    streak = streak > 0 ? streak + 1 : 1;
    result.textContent = 'You win this round';
    result.className = 'result-line win';
    trash.textContent = randomFrom(winTrash);
  } else if (outcome === 'lose') {
    aiScore++;
    streak = streak < 0 ? streak - 1 : -1;
    result.textContent = 'The machine wins this round';
    result.className = 'result-line lose';
    trash.textContent = randomFrom(loseTrash);
  } else {
    tieScore++;
    streak = 0;
    result.textContent = "It's a tie";
    result.className = 'result-line tie';
    trash.textContent = randomFrom(tieTrash);
  }

  document.getElementById('playerScore').textContent = playerScore;
  document.getElementById('aiScore').textContent = aiScore;
  document.getElementById('tieScore').textContent = tieScore;

  const badge = document.getElementById('streakBadge');
  badge.classList.remove('hot', 'cold');
  if (streak > 1) { badge.textContent = `${streak} win streak`; badge.classList.add('hot'); }
  else if (streak < -1) { badge.textContent = `${Math.abs(streak)} loss streak`; badge.classList.add('cold'); }
  else badge.textContent = 'No streak yet';

  if (playerScore >= 5 && playerScore - aiScore >= 2) {
    setTimeout(() => { trash.textContent = "You win overall. I'm shutting down out of shame. Reset if you dare."; }, 700);
  } else if (aiScore >= 5 && aiScore - playerScore >= 2) {
    setTimeout(() => { trash.textContent = 'Total domination achieved. Bow before your robot overlord.'; }, 700);
  }
}

function resetGame() {
  playerScore = aiScore = tieScore = streak = 0;
  document.getElementById('playerScore').textContent = 0;
  document.getElementById('aiScore').textContent = 0;
  document.getElementById('tieScore').textContent = 0;
  const badge = document.getElementById('streakBadge');
  badge.className = 'streak-badge';
  badge.textContent = 'No streak yet';

  const playerSlot = document.getElementById('playerSlot');
  const aiSlot = document.getElementById('aiSlot');
  playerSlot.classList.remove('win-glow', 'lose-dim', 'clash');
  aiSlot.classList.remove('win-glow', 'lose-dim', 'clash');
  setIcon(playerSlot, 'question');
  setIcon(aiSlot, 'robot');

  document.getElementById('result').textContent = 'Make your move.';
  document.getElementById('result').className = 'result-line';
  document.getElementById('trash').textContent = randomFrom(idleLines);
}
</script>
</body>
</html>
