<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proarcoder</title>
<meta name="theme-color" content="#0b0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --ink: #e6e9f0;
    --muted: #8c94a6;
    --night: #0b0e14;
    --glass: rgba(16, 20, 30, .55);
    --line: rgba(190, 205, 235, .12);
    --accent: #8fa6d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh;
    font-family: "Instrument Sans", system-ui, sans-serif;
    color: var(--ink);
    background: var(--night);
    overflow-x: hidden;
  }

  /* Background photo + darkening so text stays readable */
  .bg {
    position: fixed; inset: 0; z-index: -3;
    background: url("https://raw.githubusercontent.com/alloumohamed/alloumohamed.github.io/refs/heads/main/back.png") center / cover no-repeat;
  }
  .shade {
    position: fixed; inset: 0; z-index: -2;
    background: linear-gradient(180deg, rgba(11,14,20,.08), rgba(11,14,20,.35));
  }
  #rain { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

  main {
    width: min(460px, 100% - 40px);
    margin: 0 auto;
    padding: 9vh 0 70px;
    display: flex; flex-direction: column; align-items: center;
    transition: opacity 1.2s ease, transform 1.2s ease, visibility 0s;
  }
  body.idle main {
    opacity: 0; transform: translateY(10px);
    visibility: hidden; pointer-events: none;
    transition: opacity 1.2s ease, transform 1.2s ease, visibility 0s 1.2s;
  }
  body.idle .toast { opacity: 0; }

  /* Profile */
  .pfp-wrap {
    position: relative; width: 148px; height: 148px; border-radius: 50%;
    padding: 4px;
    border: 2px solid transparent;
    transition: border-color .3s ease, box-shadow .3s ease;
    -webkit-tap-highlight-color: transparent;
    animation: float 7s ease-in-out infinite;
  }
  .pfp-wrap img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
    display: block; background: #151a26;
  }
  .pfp-wrap:hover, .pfp-wrap:active {
    border-color: rgba(190,205,235,.55);
    box-shadow: 0 0 40px rgba(120,150,210,.25);
  }
  @keyframes float { 50% { transform: translateY(-6px); } }

  h1 {
    margin-top: 28px;
    font-family: "Newsreader", Georgia, serif;
    font-style: italic; font-weight: 300;
    font-size: clamp(2.4rem, 8vw, 3.2rem);
    letter-spacing: -.01em;
    line-height: 1.1;
    text-shadow: 0 2px 30px rgba(0,0,0,.6);
  }
  .tagline {
    margin-top: 10px;
    font-family: "Newsreader", Georgia, serif;
    font-style: italic; font-weight: 300;
    font-size: 1.1rem;
    color: var(--muted);
    text-align: center;
    min-height: 1.6em;
  }
  .tagline::after {
    content: ""; display: inline-block; width: 1px; height: 1.05em;
    background: var(--muted); margin-left: 3px; vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Links */
  .links { list-style: none; width: 100%; margin-top: 40px; display: grid; gap: 10px; }
  .links a {
    --brand: var(--accent);
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    border: 1px solid transparent;
    border-radius: 14px;
    -webkit-tap-highlight-color: transparent;
    background: transparent;
    text-shadow: 0 1px 8px rgba(0,0,0,.7);
    color: inherit; text-decoration: none;
    transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
    cursor: pointer;
  }
  .links a:hover, .links a:focus-visible, .links a:active {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--brand) 55%, transparent);
    background: color-mix(in srgb, var(--brand) 10%, transparent);
    box-shadow: 0 10px 30px color-mix(in srgb, var(--brand) 18%, transparent);
    outline: none;
  }
  .links a:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .ico {
    flex: none; width: 42px; height: 42px; border-radius: 11px;
    display: grid; place-items: center; font-size: 1.25rem;
    color: var(--brand);
    background: color-mix(in srgb, var(--brand) 12%, transparent);
    transition: background .25s, color .25s;
  }
  .links a:hover .ico { background: var(--brand); color: #0b0e14; }
  .txt { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .txt b { font-weight: 600; font-size: 1rem; }
  .txt span { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
  .go { margin-left: auto; color: var(--muted); font-size: .85rem; transition: transform .25s, color .25s; }
  .links a:hover .go { transform: translateX(3px); color: var(--ink); }

  .ig { --brand: #e4739b; }
  .fb { --brand: #5b9bff; }
  .tg { --brand: #4cb8e8; }
  .yt { --brand: #ff5a5a; }
  .wa { --brand: #4fd08a; }
  .dc { --brand: #8e9bff; }
  .gh { --brand: #c9d1d9; }

  footer {
    position: relative; margin-top: 56px; padding-top: 34px;
    text-align: center;
    font-family: "Caveat", cursive; font-weight: 600;
    font-size: 1.7rem; color: #cfd8ee;
    text-shadow: 0 0 18px rgba(143,166,209,.45);
  }
  footer .l {
    display: inline-block; opacity: 0;
    transform: translateY(8px) rotate(-4deg);
    animation: write .6s ease forwards, bob 3.2s ease-in-out infinite;
    animation-delay: calc(var(--i) * .09s + .6s), calc(var(--i) * .09s + 1.8s);
  }
  footer .sp { width: .35em; }
  @keyframes write { to { opacity: 1; transform: none; } }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .note {
    position: absolute; bottom: 8px; left: var(--x);
    font-size: var(--s); color: var(--accent); opacity: 0;
    animation: rise 5s ease-in infinite; animation-delay: var(--d);
    pointer-events: none; font-family: "Instrument Sans", sans-serif;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translate(0, 0) rotate(0); }
    15% { opacity: .85; }
    50% { transform: translate(14px, -40px) rotate(12deg); }
    100% { opacity: 0; transform: translate(-10px, -90px) rotate(-12deg); }
  }

  /* Toast for Discord copy */
  .toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translate(-50%, 20px);
    padding: 11px 18px; border-radius: 999px;
    background: rgba(20,25,38,.92); border: 1px solid transparent;
    font-size: .9rem; opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .pfp-wrap { animation: none; }
    .tagline::after { animation: none; }
    footer .l { animation: write .01ms forwards; animation-delay: 0s; }
    .note { display: none; }
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <canvas id="rain" aria-hidden="true"></canvas>

  <main>
    <div class="pfp-wrap">
      <img src="https://raw.githubusercontent.com/alloumohamed/alloumohamed.github.io/refs/heads/main/pfp.png" alt="proarcoder profile picture">
    </div>

    <h1>Allou Mohamed</h1>
    <p class="tagline" id="tagline"></p>

    <ul class="links">
      <li><a class="ig" href="https://instagram.com/proarcoder.1" target="_blank" rel="noopener">
        <span class="ico"><i class="fa-brands fa-instagram"></i></span>
        <span class="txt"><b>Instagram</b><span>@proarcoder.1</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square go"></i></a></li>

      <li><a class="fb" href="https://facebook.com/proarcoder" target="_blank" rel="noopener">
        <span class="ico"><i class="fa-brands fa-facebook-f"></i></span>
        <span class="txt"><b>Facebook</b><span>proarcoder</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square go"></i></a></li>

      <li><a class="tg" href="https://t.me/proarcoder" target="_blank" rel="noopener">
        <span class="ico"><i class="fa-brands fa-telegram"></i></span>
        <span class="txt"><b>Telegram</b><span>@proarcoder</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square go"></i></a></li>

      <li><a class="yt" href="https://youtube.com/@proarcoder" target="_blank" rel="noopener">
        <span class="ico"><i class="fa-brands fa-youtube"></i></span>
        <span class="txt"><b>YouTube</b><span>@proarcoder</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square go"></i></a></li>

      <li><a class="wa" href="https://wa.me/213559034551" target="_blank" rel="noopener">
        <span class="ico"><i class="fa-brands fa-whatsapp"></i></span>
        <span class="txt"><b>WhatsApp</b><span>+213 559 034 551</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square go"></i></a></li>

      <li><a class="gh" href="https://github.com/varnosbit" target="_blank" rel="noopener">
        <span class="ico"><i class="fa-brands fa-github"></i></span>
        <span class="txt"><b>GitHub</b><span>varnosbit</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square go"></i></a></li>

      <li><a class="dc" href="#" id="discord" role="button">
        <span class="ico"><i class="fa-brands fa-discord"></i></span>
        <span class="txt"><b>Discord</b><span>mimoxoneshot</span></span>
        <i class="fa-regular fa-copy go"></i></a></li>
    </ul>

    <footer id="credit" aria-label="by proarcoder">
      <i class="note" style="--x:8%;--s:1.2rem;--d:0s">♪</i>
      <i class="note" style="--x:28%;--s:1.6rem;--d:1.2s">♫</i>
      <i class="note" style="--x:52%;--s:1.1rem;--d:2.4s">♪</i>
      <i class="note" style="--x:74%;--s:1.5rem;--d:.7s">♫</i>
      <i class="note" style="--x:90%;--s:1.2rem;--d:3.2s">♩</i>
    </footer>
  </main>

  <div class="toast" id="toast" role="status">Discord username copied</div>

<script>
/* ---------- Rain ---------- */
(() => {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, drops = [], splashes = [], wind = 0.18, targetWind = 0.18;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.floor(Math.min(w * h / 5500, 260));
    drops = Array.from({ length: count }, () => makeDrop(true));
  }

  function makeDrop(initial) {
    const depth = Math.random(); // 0 far, 1 near
    return {
      x: Math.random() * (w + 200) - 100,
      y: initial ? Math.random() * h : -40,
      len: 10 + depth * 22,
      speed: 9 + depth * 16,
      alpha: .12 + depth * .4,
      width: .5 + depth * 1,
      depth
    };
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);
    wind += (targetWind - wind) * 0.03;
    ctx.lineCap = 'round';

    for (const d of drops) {
      const dx = wind * d.len, dy = d.len;
      ctx.strokeStyle = `rgba(185,205,240,${d.alpha})`;
      ctx.lineWidth = d.width;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + dx, d.y + dy);
      ctx.stroke();

      d.y += d.speed;
      d.x += d.speed * wind;

      if (d.y > h - (1 - d.depth) * h * 0.12) {
        if (d.depth > .55 && Math.random() < .5) {
          splashes.push({ x: d.x, y: h - Math.random() * 6, r: 1, max: 6 + d.depth * 8, a: .35 });
        }
        Object.assign(d, makeDrop(false));
      }
    }

    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.r += .45; s.a -= .02;
      if (s.a <= 0 || s.r > s.max) { splashes.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(185,205,240,${s.a})`;
      ctx.lineWidth = .8;
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, s.r * 1.8, s.r * .5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  addEventListener('pointermove', e => { targetWind = ((e.clientX / innerWidth) - .5) * .5 + .12; });
  resize();
  if (reduce) { drops.forEach(d => d.speed *= .35); }
  frame();
})();

/* ---------- Typed tagline ---------- */
(() => {
  const el = document.getElementById('tagline');
  const lines = ['Im from Algeria.', 'Im 21 years old.', 'building things while it rains.'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.textContent = lines[0]; return; }
  let li = 0, ci = 0, del = false;
  (function tick() {
    const t = lines[li];
    el.textContent = t.slice(0, ci);
    if (!del && ci === t.length) { del = true; return setTimeout(tick, 2400); }
    if (del && ci === 0) { del = false; li = (li + 1) % lines.length; return setTimeout(tick, 500); }
    ci += del ? -1 : 1;
    setTimeout(tick, del ? 28 : 65);
  })();
})();

/* ---------- Hide UI after 3s without touch, show on any input ---------- */
(() => {
  let t;
  const hide = () => document.body.classList.add('idle');
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(t);
    t = setTimeout(hide, 3000);
  };
  ['pointermove', 'pointerdown', 'touchstart', 'keydown', 'wheel', 'scroll']
    .forEach(e => addEventListener(e, wake, { passive: true }));
  wake();
})();

/* ---------- Footer credit ---------- */
(() => {
  const f = document.getElementById('credit');
  [...'by proarcoder'].forEach((c, i) => {
    const s = document.createElement('span');
    s.className = c === ' ' ? 'l sp' : 'l';
    s.style.setProperty('--i', i);
    s.setAttribute('aria-hidden', 'true');
    s.textContent = c === ' ' ? '\u00a0' : c;
    f.appendChild(s);
  });
})();
document.addEventListener('touchstart', () => {}, { passive: true });

/* ---------- Discord copy ---------- */
(() => {
  const btn = document.getElementById('discord');
  const toast = document.getElementById('toast');
  let timer;
  async function copy() {
    const name = 'mimoxoneshot';
    try { await navigator.clipboard.writeText(name); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = name; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 2000);
  }
  btn.addEventListener('click', e => { e.preventDefault(); copy(); });
  btn.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); copy(); } });
})();
</script>
</body>
</html>
